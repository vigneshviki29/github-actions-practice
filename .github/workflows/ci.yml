name: Node.js CI Practice

# 1. Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # 2. Specify the operating system environment
    runs-on: ubuntu-latest

    steps:
    # 3. Check out the repository's code onto the runner
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 4. Set up the Node.js runtime environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
      -node-version: '22'
        cache: 'npm' # Best practice: caches dependencies to speed up runs

    # 5. Install dependencies (even if empty)
    - name: Install dependencies
      run: npm install

    # 6. Run the script we defined in package.json
    - name: Run tests
      run: npm test
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
